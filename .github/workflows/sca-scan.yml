name: SCA Scan

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:
    inputs:
      scan-tag:
        description: "Scan only this git tag; empty = default branch and latest releases"
        type: string
        default: ""
      force-image-scan:
        description: "Run the OSV image scan on this run even if it is turned off"
        type: boolean
        default: false

run-name: >-
  SCA - w4test - ${{ inputs.scan-tag || 'full set' }}

permissions:
  contents: read
  packages: read

jobs:
  sca:
    uses: vitado/ai-dial-ci/.github/workflows/sca_scheduled.yml@sca-canary
    with:
      repository: epam/ai-dial-admin-frontend
      images: |
        epam/ai-dial-admin-frontend
      scan-tag: ${{ inputs.scan-tag }}
      force-image-scan: ${{ inputs.force-image-scan || false }}
